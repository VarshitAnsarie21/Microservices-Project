version: '3.8'

services:
  user-service:
    build: ./user-service
    ports:
      - "8081:8081"
    depends_on:
      - mysql
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/actuator/health" ]
      interval: 30s
      retries: 3

  product-service:
    build: ./product-service
    ports:
      - "8082:8082"
    depends_on:
      - mysql
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8082/actuator/health" ]
      interval: 30s
      retries: 3

  order-service:
    build: ./order-service
    ports:
      - "8083:8083"
    depends_on:
      - mysql
      - user-service
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8083/actuator/health" ]
      interval: 30s
      retries: 3

  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    environment:
      MYSQL_DATABASE: orderdb
      MYSQL_ROOT_PASSWORD: Simplilearn
    ports:
      - "3306:3306"
